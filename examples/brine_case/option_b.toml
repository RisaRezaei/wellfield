# Brine well siting, fictional coastal site: option B
title = "Option B: brine well 1.2 km down-gradient"
output = "out_option_b"

[aquifer]
thickness = 20.0          # m
porosity = 0.25           # effective porosity
# transmissivity = 600    # m2/day; leave out to estimate it from the pumping test

[pumping_test]
file = "pumping_test.csv" # columns: time, drawdown (m)
time_unit = "minutes"
rate = 1500.0             # m3/day
distance = 40.0           # m from the pumping well to the observation well

[regional_flow]
file = "observation_wells.csv"   # columns: name, x, y, head (m)

[wells]
file = "wells_option_b.csv"          # columns: name, x, y, rate (m3/day; + extraction, - injection)

[protection_zones]
wells = ["Town well"]
days = [50, 365]

[[connection]]
source = "Brine well"
sink = "Town well"
dispersivity = 20.0              # m
source_concentration = 70.0      # g/L
background = 0.5                 # g/L
limit = 1.0                      # g/L
unit = "g/L"
